<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 250px; padding: 15px; font-family: sans-serif; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <h3>Wealth-Wait Setup</h3>
    <div class="field">
        <label>Hourly Wage ($)</label>
        <input type="number" id="wage">
    </div>
    <div class="field">
        <label>Saving For?</label>
        <input type="text" id="goal">
    </div>
    <div class="field">
    <label>Goal Cost ($)</label>
    <input type="number" id="goalCost" placeholder="e.g. 5000">
</div>
<div class="field">
    <label>Current Savings ($)</label>
    <input type="number" id="currentSavings" placeholder="e.g. 1200">
</div>
    <button id="save">Save Settings</button>
    <script src="popup.js"></script>
</body>
</html>
