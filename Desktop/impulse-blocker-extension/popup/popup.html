<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Worth It?</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="app">
            <!-- Fixed top: header + tabs -->
            <header class="header">
                <div>
                    <div class="header-title">Worth It?</div>
                    <div class="header-sub">Think before you spend</div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="toggle-enabled" checked />
                    <span class="toggle-track"></span>
                </label>
            </header>

            <nav class="tabs">
                <button class="tab active" data-tab="dashboard">
                    Overview
                </button>
                <button class="tab" data-tab="history">History</button>
                <button class="tab" data-tab="settings">Settings</button>
            </nav>

            <!-- Scrollable content area -->
            <div class="app-body">
                <!-- Overview -->
                <div class="panel active" id="panel-dashboard">
                    <div class="section">
                        <div class="section-label">Spent this month</div>
                        <div class="big-number">
                            <span class="currency">$</span
                            ><span id="stat-spent">0</span>
                        </div>
                        <div class="bar-track">
                            <div
                                class="bar-fill"
                                id="budget-bar-fill"
                                style="width: 0%"
                            ></div>
                        </div>
                        <div class="bar-meta">
                            <span id="budget-spent-label">$0 spent</span>
                            <span id="budget-pct">0% of budget</span>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="stats">
                        <div class="stat">
                            <div class="stat-number val-green" id="stat-left">
                                $0
                            </div>
                            <div class="stat-label">Remaining</div>
                        </div>
                        <div class="stat">
                            <div
                                class="stat-number val-purple"
                                id="stat-blocked"
                            >
                                0
                            </div>
                            <div class="stat-label">Blocked</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number val-amber" id="stat-bobas">
                                0
                            </div>
                            <div class="stat-label">Bobas saved</div>
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div class="panel" id="panel-history">
                    <div id="history-list"></div>
                </div>

                <!-- Settings -->
                <div class="panel" id="panel-settings">
                    <div class="field">
                        <label class="field-label" for="set-budget"
                            >Monthly budget</label
                        >
                        <div class="field-row">
                            <span class="field-adornment">$</span>
                            <input
                                type="number"
                                id="set-budget"
                                class="field-input"
                                placeholder="2000"
                                min="0"
                                step="100"
                            />
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" for="set-cooldown"
                            >Cooldown timer</label
                        >
                        <div class="field-row">
                            <input
                                type="number"
                                id="set-cooldown"
                                class="field-input"
                                placeholder="30"
                                min="5"
                                max="300"
                                step="5"
                            />
                            <span class="field-adornment field-adornment-right"
                                >sec</span
                            >
                        </div>
                        <p class="field-hint">
                            Seconds you must wait before "Buy anyway" unlocks
                        </p>
                    </div>

                    <button class="btn-primary" id="save-btn">
                        Save changes
                    </button>
                    <button class="btn-ghost" id="reset-btn">
                        Reset monthly data
                    </button>
                </div>
            </div>
            <!-- /.app-body -->
        </div>
        <!-- /.app -->

        <div class="toast" id="toast"></div>
        <script src="popup.js"></script>
    </body>
</html>
